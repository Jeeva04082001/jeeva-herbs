

services:
  web:
    build: .
    container_name: jeeva_herbs_backend
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    # command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8002:8000"
    depends_on:
      - db
      - redis   # 🔥 ADD THIS
    env_file:
      - .env

  db:
    image: postgres:15
    container_name: jeeva_herbs
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:   # 🔥 NEW SERVICE
    image: redis:7
    container_name: jeeva_herbs_redis
    restart: always
    ports:
      - "6380:6379"

  # celery:
